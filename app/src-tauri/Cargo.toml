[package]
name = "subtitler-app"
version = "1.0.0"
edition = "2021"
description = "Subtitler desktop UI (Phase 5)"

# Standalone package: the root Cargo workspace is owned by the CLI pipeline;
# this crate intentionally does not join it.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
subtitler-core = { path = "../../crates/core" }
subtitler-export = { path = "../../crates/export" }
subtitler-media = { path = "../../crates/media" }
subtitler-pipeline = { path = "../../crates/pipeline" }
subtitler-segment = { path = "../../crates/segment" }
subtitler-store = { path = "../../crates/store" }
subtitler-stt = { path = "../../crates/stt" }
subtitler-translate = { path = "../../crates/translate" }

[lib]
name = "subtitler_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
